[project]
name = "homework-week-2-3-aufgabe-5"
version = "1.0.0"
description = "Coding Challenge für AI Development Kurs - Embeddings und Mini-RAG"
authors = [
    {name = "AI Development Kurs", email = "kurs@example.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "sentence-transformers>=2.2.0",
    "openai>=1.0.0",
    "numpy>=1.21.0",
    "scikit-learn>=1.0.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "python-dotenv>=0.19.0",
    "pathlib2>=2.3.0",
]

[project.optional-dependencies]
extended = [
    "chromadb>=0.4.0",
    "faiss-cpu>=1.7.0",
]

[project.scripts]
embedding-test = "embedding_test:main"
mini-rag = "mini_rag:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
